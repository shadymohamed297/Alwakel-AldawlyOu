name: Android build

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages
        # GitHub-hosted ubuntu runners ship an Android SDK preinstalled (ANDROID_HOME is
        # already set) — no separate setup-android action needed, one less thing to break.
        # Installing explicitly (rather than trusting whatever happens to be preinstalled)
        # keeps this pinned to what the app actually targets.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/assemble.log

      - name: Surface build failure as annotations
        # Actions log downloads redirect to blob storage that isn't reachable from every
        # environment developing this repo; annotations are readable through the plain
        # REST API instead, so a failure here is always diagnosable from just that API.
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|Exception|BUILD FAILED|Unresolved reference|cannot find symbol" /tmp/assemble.log | tail -n 30 | sed 's/^/::error::/' || true
          echo "::error::--- last 20 lines of build output ---"
          tail -n 20 /tmp/assemble.log | sed 's/^/::error::/'

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: markaz-sayana-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
